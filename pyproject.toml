[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sovereign-cloud-architect"
version = "1.0.0"
description = "Multi-cloud architecture validation and simulation SDK. Evaluates infrastructure-as-code against 1,000+ enterprise governance rules across AWS, GCP, and Azure, simulating failover scenarios and multi-tenant database sharding."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Russell Alan Powers", email = "russell@sovereignbizbox.io"}
]
keywords = ["sovereign", "cloud infrastructure & sre", "microservice", "n8n", "automation"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries"
]
dependencies = []

[project.scripts]
sovereign-cloud-architect = "src.cli:main"
